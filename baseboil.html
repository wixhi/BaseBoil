<script>
// ─── constants.js ────────────────────────────────────────────────────────────
const CANVAS_WIDTH = 1200, CANVAS_HEIGHT = 720, VIEWPORT_HEIGHT = 600, HUD_HEIGHT = 120;
const TILE = 32, MAP_COLS = 64, MAP_ROWS = 48;
const TILE_TYPE = { GRASS:0, DIRT:1, OBSTACLE:2, RESOURCE:3 };
const TEAM = { PLAYER:0, ENEMY:1 };
const STATE = { IDLE:'IDLE', MOVING:'MOVING', ATTACKING:'ATTACKING', HARVESTING:'HARVESTING', RETURNING:'RETURNING', BUILDING:'BUILDING', DEAD:'DEAD' };
const RESEARCH = { HIGH_PROTEIN:'HIGH_PROTEIN', WHEY_PROTEIN:'WHEY_PROTEIN', CREATINE:'CREATINE', STEROIDS:'STEROIDS' };

const BLDG = { DUGOUT:'DUGOUT', BATTING_CAGE:'BATTING_CAGE', BULLPEN:'BULLPEN', BLEACHERS:'BLEACHERS', RESEARCH_LAB:'RESEARCH_LAB', BEEF_FARM:'BEEF_FARM' };
const COLORS = {

  BUTTON_DISABLED:'#111827', BUTTON_BORDER:'#374151',
  GRASS:'#2d5a27', GRASS_GRID:'#1e3d1a', DIRT:'#8B6914', OBSTACLE:'#3c3c3c', OBSTACLE_BORDER:'#222222',

  ENEMY_BLDG_FILL:'#7f0000', ENEMY_BLDG_STROKE:'#ef5350',
  ORANGE:'#ff9800', FIRE:'#ff6b35', CYAN:'#4fc3f7', GOLD:'#ffd700', WHITE:'#ffffff',
  RED:'#ef5350', GREEN:'#4caf50', YELLOW:'#ffeb3b',
  BASEBALL_FILL:'#ffffff', BASEBALL_GLOW:'#ff9800', TRAIL:'#ff6b35',
  SELECTION_FILL:'rgba(79,195,247,0.15)', SELECTION_STROKE:'#4fc3f7',
  HP_HIGH:'#4caf50', HP_MID:'#ffeb3b', HP_LOW:'#ef5350', HP_BG:'#1a1a1a',
  OVERLAY_BG:'rgba(10,10,15,0.88)', VICTORY:'#ffd700', DEFEAT:'#ef5350',

const INNING_DURATION = 60, MAX_INNINGS = 9;

// ─── defs.js ─────────────────────────────────────────────────────────────────
const UNIT_DEF = {
  [UNIT.GROUNDSKEEPER]: { label:'BB', name:'Ball Boy', hp:40, speed:70, damage:4, range:32, attackSpeed:1.0, isWorker:true, harvestRate:10, carryMax:15, cost:50, trainTime:12, radius:10, isRanged:false, projectileSpeed:0, playerColor:'#90caf9', enemyColor:'#ef9a9a' },
  [UNIT.BATTER]:        { label:'B',  name:'Batter',   hp:90, speed:68, damage:22, range:38, attackSpeed:0.9, isWorker:false, harvestRate:0, carryMax:0, cost:75, trainTime:15, radius:11, isRanged:false, projectileSpeed:0, playerColor:'#4fc3f7', enemyColor:'#ef5350' },
  [UNIT.PITCHER]:       { label:'P',  name:'Pitcher',  hp:55, speed:60, damage:14, range:170, attackSpeed:0.75, isWorker:false, harvestRate:0, carryMax:0, cost:100, trainTime:18, radius:10, isRanged:true, projectileSpeed:280, playerColor:'#4fc3f7', enemyColor:'#ef5350' },
  [UNIT.CATCHER]:       { label:'C',  name:'Catcher',  hp:180, speed:48, damage:12, range:36, attackSpeed:0.65, isWorker:false, harvestRate:0, carryMax:0, cost:125, trainTime:22, radius:13, isRanged:false, projectileSpeed:0, playerColor:'#4fc3f7', enemyColor:'#ef5350' },
  [UNIT.SLUGGER]:       { label:'S',  name:'Slugger',  hp:130, speed:55, damage:40, range:40, attackSpeed:0.45, isWorker:false, harvestRate:0, carryMax:0, cost:150, trainTime:25, radius:12, isRanged:false, projectileSpeed:0, playerColor:'#4fc3f7', enemyColor:'#ef5350' }
};
const BLDG_DEF = {
  [BLDG.DUGOUT]:       { name:'Dugout',       label:'DUG', hp:1000, isMain:true,  cost:0,   buildTime:0,  tileW:3, tileH:3, trainable:[UNIT.GROUNDSKEEPER], isAttacker:false, attackDamage:0,  attackRange:0,   attackSpeed:0,   isRanged:false },
  [BLDG.BATTING_CAGE]: { name:'Batting Cage', label:'BC',  hp:450,  isMain:false, cost:150, buildTime:20, tileW:2, tileH:2, trainable:[UNIT.BATTER, UNIT.CATCHER], isAttacker:false, attackDamage:0, attackRange:0, attackSpeed:0, isRanged:false },
  [BLDG.BULLPEN]:      { name:'Bullpen',      label:'BP',  hp:450,  isMain:false, cost:175, buildTime:20, tileW:2, tileH:2, trainable:[UNIT.PITCHER, UNIT.SLUGGER], isAttacker:false, attackDamage:0, attackRange:0, attackSpeed:0, isRanged:false },
  [BLDG.BLEACHERS]:    { name:'Bleachers',    label:'BL',  hp:350,  isMain:false, cost:125, buildTime:15, tileW:2, tileH:2, trainable:[], isAttacker:true, attackDamage:15, attackRange:220, attackSpeed:0.6, isRanged:true, popBonus:5 },
  [BLDG.RESEARCH_LAB]: { name:'Research Lab', label:'LAB', hp:400,  isMain:false, cost:200, buildTime:25, tileW:2, tileH:2, trainable:[], isAttacker:false, attackDamage:0, attackRange:0, attackSpeed:0, isRanged:false },
  [BLDG.BEEF_FARM]:    { name:'Beef Farm',    label:'BF',  hp:350,  isMain:false, cost:175, buildTime:20, tileW:2, tileH:2, trainable:[], isAttacker:false, attackDamage:0, attackRange:0, attackSpeed:0, isRanged:false }
};
const RESEARCH_DEF = {
  [RESEARCH.HIGH_PROTEIN]: { name:'High Protein Diet', icon:'🥩', desc:'+25 HP all units', cost:100, hp:25, damage:0, attackSpeed:0 },
  [RESEARCH.WHEY_PROTEIN]: { name:'Whey Protein',      icon:'🥛', desc:'+8 dmg all units', cost:125, hp:0, damage:8, attackSpeed:0 },
  [RESEARCH.CREATINE]:     { name:'Creatine',           icon:'💊', desc:'+25% atk speed',  cost:150, hp:0, damage:0, attackSpeed:0.25 },
  [RESEARCH.STEROIDS]:     { name:'Steroids',           icon:'💉', desc:'+30HP +12dmg',    cost:300, hp:30, damage:12, attackSpeed:0 }
};

// ─── utils.js ────────────────────────────────────────────────────────────────
let _idCounter = 0;
function genId() { return ++_idCounter; }
function dist(a,b) { const dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function norm(dx,dy) { const l=Math.sqrt(dx*dx+dy*dy); return l===0?{x:0,y:0}:{x:dx/l,y:dy/l}; }
function clamp(v,min,max) { return Math.max(min,Math.min(max,v)); }
function tileToWorld(tx,ty) { return {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2}; }
function worldToTile(wx,wy) { return {tx:Math.floor(wx/TILE), ty:Math.floor(wy/TILE)}; }
function rectOverlap(r1,r2) { return r1.x<r2.x+r2.w&&r1.x+r1.w>r2.x&&r1.y<r2.y+r2.h&&r1.y+r1.h>r2.y; }
function pointInRect(px,py,rx,ry,rw,rh) { return px>=rx&&px<=rx+rw&&py>=ry&&py<=ry+rh; }
function drawRoundedRect(ctx,x,y,w,h,r) {
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function astar(start,goal,isBlocked) {
  const key=t=>`${t.tx},${t.ty}`;
  if (start.tx===goal.tx&&start.ty===goal.ty) return [goal];
  if (isBlocked(goal.tx,goal.ty)) {
    const adj=[{tx:goal.tx-1,ty:goal.ty},{tx:goal.tx+1,ty:goal.ty},{tx:goal.tx,ty:goal.ty-1},{tx:goal.tx,ty:goal.ty+1},{tx:goal.tx-1,ty:goal.ty-1},{tx:goal.tx+1,ty:goal.ty-1},{tx:goal.tx-1,ty:goal.ty+1},{tx:goal.tx+1,ty:goal.ty+1}];
    let found=null;
    for (const a of adj) if (a.tx>=0&&a.tx<MAP_COLS&&a.ty>=0&&a.ty<MAP_ROWS&&!isBlocked(a.tx,a.ty)){found=a;break;}
    if (!found) return [goal]; goal=found;
  }
  const heuristic=t=>Math.abs(t.tx-goal.tx)+Math.abs(t.ty-goal.ty);
  const openSet=[]; const cameFrom={},gScore={},fScore={};
  const startKey=key(start); gScore[startKey]=0; fScore[startKey]=heuristic(start);
  openSet.push({tile:start,f:fScore[startKey]});
  const closedSet=new Set();
  const neighbors=t=>{const result=[];const dirs=[{tx:t.tx-1,ty:t.ty},{tx:t.tx+1,ty:t.ty},{tx:t.tx,ty:t.ty-1},{tx:t.tx,ty:t.ty+1},{tx:t.tx-1,ty:t.ty-1},{tx:t.tx+1,ty:t.ty-1},{tx:t.tx-1,ty:t.ty+1},{tx:t.tx+1,ty:t.ty+1}];for(const d of dirs){if(d.tx<0||d.tx>=MAP_COLS||d.ty<0||d.ty>=MAP_ROWS)continue;if(isBlocked(d.tx,d.ty))continue;if(d.tx!==t.tx&&d.ty!==t.ty&&(isBlocked(d.tx,t.ty)||isBlocked(t.tx,d.ty)))continue;result.push(d);}return result;};
  let iter=0;
  while(openSet.length>0&&iter<2000){iter++;openSet.sort((a,b)=>a.f-b.f);const current=openSet.shift().tile;const cKey=key(current);if(current.tx===goal.tx&&current.ty===goal.ty){const path=[];let cur=cKey;while(cur){const[tx,ty]=cur.split(',').map(Number);path.unshift({tx,ty});cur=cameFrom[cur];}return path;}closedSet.add(cKey);for(const nb of neighbors(current)){const nKey=key(nb);if(closedSet.has(nKey))continue;const diag=nb.tx!==current.tx&&nb.ty!==current.ty;const tg=(gScore[cKey]||0)+(diag?1.414:1);if(gScore[nKey]===undefined||tg<gScore[nKey]){cameFrom[nKey]=cKey;gScore[nKey]=tg;fScore[nKey]=tg+heuristic(nb);const ei=openSet.findIndex(o=>key(o.tile)===nKey);if(ei>=0)openSet[ei].f=fScore[nKey];else openSet.push({tile:nb,f:fScore[nKey]});}}}
  return [goal];
}

// ─── map.js ──────────────────────────────────────────────────────────────────
class GameMap {
  constructor() {
    this.tiles=[]; this.blocked=[]; this.resourceTiles=[];
    for(let r=0;r<MAP_ROWS;r++){this.tiles[r]=new Array(MAP_COLS).fill(TILE_TYPE.GRASS);this.blocked[r]=new Array(MAP_COLS).fill(false);}
  }
  isInBounds(tx,ty){return tx>=0&&tx<MAP_COLS&&ty>=0&&ty<MAP_ROWS;}
  isBlocked(tx,ty){if(!this.isInBounds(tx,ty))return true;return this.blocked[ty][tx];}
  getTile(tx,ty){if(!this.isInBounds(tx,ty))return TILE_TYPE.OBSTACLE;return this.tiles[ty][tx];}
  setBlocked(tx,ty,val){if(this.isInBounds(tx,ty))this.blocked[ty][tx]=val;}
  setTile(tx,ty,type){if(!this.isInBounds(tx,ty))return;this.tiles[ty][tx]=type;if(type===TILE_TYPE.OBSTACLE)this.blocked[ty][tx]=true;}
  generate(playerBase,enemyBase){
    for(let r=0;r<MAP_ROWS;r++)for(let c=0;c<MAP_COLS;c++){this.tiles[r][c]=TILE_TYPE.GRASS;this.blocked[r][c]=false;}
    const nearBase=(tx,ty)=>{for(const b of [playerBase,enemyBase]){const dx=tx-b.tx,dy=ty-b.ty;if(Math.sqrt(dx*dx+dy*dy)<6)return true;}return false;};
    let placed=0,attempts=0;
    while(placed<18&&attempts<500){attempts++;const cx=5+Math.floor(Math.random()*(MAP_COLS-10)),cy=5+Math.floor(Math.random()*(MAP_ROWS-10));if(nearBase(cx,cy))continue;const sz=3+Math.floor(Math.random()*5);for(let i=0;i<sz;i++){const tx=cx+Math.floor(Math.random()*5)-2,ty=cy+Math.floor(Math.random()*5)-2;if(this.isInBounds(tx,ty)&&!nearBase(tx,ty))this.setTile(tx,ty,TILE_TYPE.OBSTACLE);}placed++;}
    this.resourceTiles=[];placed=0;attempts=0;
    while(placed<12&&attempts<500){attempts++;const cx=4+Math.floor(Math.random()*(MAP_COLS-8)),cy=4+Math.floor(Math.random()*(MAP_ROWS-8));if(nearBase(cx,cy))continue;if(this.getTile(cx,cy)===TILE_TYPE.OBSTACLE)continue;const sz=4+Math.floor(Math.random()*5);let cp=0;for(let i=0;i<sz*3&&cp<sz;i++){const tx=cx+Math.floor(Math.random()*5)-2,ty=cy+Math.floor(Math.random()*5)-2;if(this.isInBounds(tx,ty)&&!nearBase(tx,ty)&&this.getTile(tx,ty)===TILE_TYPE.GRASS){this.setTile(tx,ty,TILE_TYPE.RESOURCE);this.resourceTiles.push({tx,ty});cp++;}}if(cp>0)placed++;}
    const cx=Math.floor(MAP_COLS/2),cy=Math.floor(MAP_ROWS/2);
    const bases=[{tx:cx,ty:cy-5},{tx:cx+5,ty:cy},{tx:cx,ty:cy+5},{tx:cx-5,ty:cy}];
    for(let i=0;i<bases.length;i++){const a=bases[i],b=bases[(i+1)%4];let x0=a.tx,y0=a.ty;const x1=b.tx,y1=b.ty,dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx-dy;while(true){if(this.isInBounds(x0,y0)&&this.getTile(x0,y0)===TILE_TYPE.GRASS)this.setTile(x0,y0,TILE_TYPE.DIRT);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}}}
    for(let dy2=-1;dy2<=1;dy2++)for(let dx2=-1;dx2<=1;dx2++){const tx=cx+dx2,ty2=cy+dy2;if(this.isInBounds(tx,ty2)&&this.getTile(tx,ty2)===TILE_TYPE.GRASS)this.setTile(tx,ty2,TILE_TYPE.DIRT);}
  }
  nearestResource(wx,wy){let best=null,bd=Infinity;for(const rt of this.resourceTiles){const dx=rt.tx*TILE+TILE/2-wx,dy=rt.ty*TILE+TILE/2-wy,d=Math.sqrt(dx*dx+dy*dy);if(d<bd){bd=d;best=rt;}}return best;}
  isAreaClear(tx,ty,tw,th){for(let r=ty;r<ty+th;r++)for(let c=tx;c<tx+tw;c++){if(!this.isInBounds(c,r))return false;if(this.blocked[r][c])return false;if(this.tiles[r][c]===TILE_TYPE.OBSTACLE)return false;}return true;}
}

// ─── entity.js ───────────────────────────────────────────────────────────────
class Entity {
  constructor(x,y,team){this.id=genId();this.x=x;this.y=y;this.team=team;this.hp=1;this.maxHp=1;this.alive=true;}
  takeDamage(amount,game){if(!this.alive)return;this.hp-=amount;if(game)game.floatingNumbers.push({x:this.x,y:this.y-16,value:amount,timer:0.8});if(this.hp<=0){this.hp=0;this.alive=false;}}
  distTo(other){return dist(this,other);}
}
class Unit extends Entity {
  constructor(type,team,x,y){
    super(x,y,team);this.type=type;const def=UNIT_DEF[type];
    this.hp=def.hp;this.maxHp=def.hp;this.speed=def.speed;this.damage=def.damage;this.range=def.range;this.attackSpeed=def.attackSpeed;
    this.isWorker=def.isWorker;this.harvestRate=def.harvestRate||0;this.carryMax=def.carryMax||0;
    this.isRanged=def.isRanged;this.projectileSpeed=def.projectileSpeed||0;this.radius=def.radius;
    this.state=STATE.IDLE;this.target=null;this.movePath=[];this.moveTarget=null;
    this.attackTimer=0;this.carryAmt=0;this.harvestTimer=0;this.harvestTarget=null;
    this.depositTarget=null;this.attackMoveTarget=null;this.idleTimer=0;this.strikeAnim=0;
    this.facing=team===TEAM.ENEMY?-1:1;
  }
  update(dt,game){
    if(!this.alive)return;
    this.attackTimer=Math.max(0,this.attackTimer-dt);
    if(this.strikeAnim>0)this.strikeAnim=Math.max(0,this.strikeAnim-dt);
    switch(this.state){
      case STATE.IDLE:      this._updateIdle(dt,game);break;
      case STATE.MOVING:    this._updateMoving(dt,game);break;
      case STATE.ATTACKING: this._updateAttacking(dt,game);break;
      case STATE.HARVESTING:this._updateHarvesting(dt,game);break;
      case STATE.RETURNING: this._updateReturning(dt,game);break;
    }
  }
  _updateIdle(dt,game){
    this.idleTimer-=dt;if(this.idleTimer>0)return;this.idleTimer=0.3;
    if(this.isWorker){
      if(this.carryAmt<this.carryMax){const res=game.map.nearestResource(this.x,this.y);if(res){this.harvestTarget=res;this.state=STATE.HARVESTING;this._pathTo(res.tx*TILE+TILE/2,res.ty*TILE+TILE/2,game);return;}}
      else{const d=game.entities.find(e=>e.alive&&e.team===this.team&&e instanceof Building&&e.type===BLDG.DUGOUT);if(d){this.depositTarget=d;this.state=STATE.RETURNING;this._pathTo(d.x,d.y,game);return;}}
    }
    const enemy=game.getNearestEnemy(this,this.range*2);if(enemy){this.target=enemy;this.state=STATE.ATTACKING;}
  }
  _updateMoving(dt,game){
    if(this.attackMoveTarget){if(!this.attackMoveTarget.alive){this.attackMoveTarget=null;}else{const d=this.distTo(this.attackMoveTarget);if(d<=this.range+(this.attackMoveTarget.radius||12)){this.target=this.attackMoveTarget;this.state=STATE.ATTACKING;this.movePath=[];return;}}}
    if(this.movePath.length===0){this.state=STATE.IDLE;this.attackMoveTarget=null;return;}
    const nt=this.movePath[0],wx=nt.tx*TILE+TILE/2,wy=nt.ty*TILE+TILE/2,dx=wx-this.x,dy=wy-this.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<4){this.movePath.shift();if(this.movePath.length===0){this.state=STATE.IDLE;this.attackMoveTarget=null;}return;}
    if(Math.abs(dx)>0.5)this.facing=dx>0?1:-1;
    const spd=this.speed*dt;this.x+=(dx/d)*spd;this.y+=(dy/d)*spd;
    this._separate(game,0.3);
  }
  _updateAttacking(dt,game){
    if(!this.target||!this.target.alive){this.target=null;this.state=STATE.IDLE;return;}
    if(Math.abs(this.target.x-this.x)>2)this.facing=this.target.x>this.x?1:-1;
    const d=this.distTo(this.target),r=this.target.radius||12;
    if(d>this.range+r+16){this._pathTo(this.target.x,this.target.y,game);this.state=STATE.MOVING;return;}
    if(this.attackTimer<=0){
      this.attackTimer=1/this.attackSpeed;
      this.strikeAnim=this.type===UNIT.SLUGGER?0.45:0.3;
      if(this.isRanged){const n=norm(this.target.x-this.x,this.target.y-this.y);game.addProjectile({x:this.x,y:this.y,vx:n.x*this.projectileSpeed,vy:n.y*this.projectileSpeed,damage:this.damage,team:this.team,targetId:this.target.id,speed:this.projectileSpeed,projType:'baseball',trail:[]});}
      else this.target.takeDamage(this.damage,game);
    }
    if(d>this.range+r){const spd=this.speed*dt,dx=this.target.x-this.x,dy=this.target.y-this.y,len=Math.sqrt(dx*dx+dy*dy);this.x+=(dx/len)*spd;this.y+=(dy/len)*spd;}
  }
  _updateHarvesting(dt,game){
    if(!this.harvestTarget){this.state=STATE.IDLE;return;}
    const tx=this.harvestTarget.tx,ty=this.harvestTarget.ty;
    if(game.map.getTile(tx,ty)!==TILE_TYPE.RESOURCE){this.harvestTarget=null;this.state=STATE.IDLE;return;}
    const wx=tx*TILE+TILE/2,wy=ty*TILE+TILE/2,d=dist({x:this.x,y:this.y},{x:wx,y:wy});
    if(d>TILE*1.5){if(this.movePath.length===0)this._pathTo(wx,wy,game);this._followPath(dt,game);return;}
    this.harvestTimer+=dt;if(this.harvestTimer>=1){this.harvestTimer-=1;this.carryAmt+=Math.min(this.harvestRate,this.carryMax-this.carryAmt);}
    if(this.carryAmt>=this.carryMax){const d2=game.entities.find(e=>e.alive&&e.team===this.team&&e instanceof Building&&e.type===BLDG.DUGOUT);if(d2){this.depositTarget=d2;this.state=STATE.RETURNING;this._pathTo(d2.x,d2.y,game);}else this.state=STATE.IDLE;}
  }
  _updateReturning(dt,game){
    if(!this.depositTarget||!this.depositTarget.alive){this.depositTarget=null;this.state=STATE.IDLE;return;}
    if(this.distTo(this.depositTarget)<48){if(this.team===TEAM.PLAYER)game.player.earn(this.carryAmt);else game.ai.baseballs+=this.carryAmt;this.carryAmt=0;this.harvestTarget=null;this.state=STATE.IDLE;return;}
    if(this.movePath.length===0)this._pathTo(this.depositTarget.x,this.depositTarget.y,game);
    this._followPath(dt,game);
  }
  _followPath(dt,game){

  _drawUnits(ctx,game){for(const e of game.entities){if(!(e instanceof Unit)||!e.alive)continue;this._drawUnit(ctx,e,game);}}
  _drawUnit(ctx,unit,game){
    const r=unit.radius;
    if(game.player.selectedIds.has(unit.id)){ctx.strokeStyle=COLORS.CYAN;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(unit.x,unit.y,r+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}

    const oy=(unit.state===STATE.IDLE||hrv)?(frame===0?0:-0.8):0;
    ctx.save();ctx.translate(unit.x,unit.y);
    // ground shadow (doesn't bob, doesn't flip)

      case UNIT.BATTER:       this._drawBatter(ctx,unit,frame);break;
      case UNIT.PITCHER:      this._drawPitcher(ctx,unit,frame);break;
      case UNIT.CATCHER:      this._drawCatcher(ctx,unit,frame);break;
      case UNIT.SLUGGER:      this._drawSlugger(ctx,unit,frame);break;
    }
    ctx.restore();

class Game {

    if(ed){this.spawnUnit(UNIT.GROUNDSKEEPER,TEAM.ENEMY,ed.x-48,ed.y-16);this.spawnUnit(UNIT.GROUNDSKEEPER,TEAM.ENEMY,ed.x-16,ed.y-48);}

  restart(){this.init();}

  _updateCamera(dt){

    return true;
  }
  _processInputActions(){for(const a of this.input.getActions()){switch(a.type){case'escape':this._handleEscape();break;case'click_left':this._handleLeftClick(a.cx,a.cy);break;case'mousedown_right':this._handleRightClick(a.cx,a.cy);break;case'box_select':this._handleBoxSelect(a.x1,a.y1,a.x2,a.y2);break;}}}
  _handleEscape(){if(this.player.buildMode){this.player.cancelBuildMode();document.getElementById('gameCanvas').classList.remove('crosshair');}else this.player.clearSelection();}
  _handleLeftClick(cx,cy){
    if(this.gameState==='start'){this.init();return;}
    if(this.gameState==='won'||this.gameState==='lost'){this.restart();return;}
    if(cy>=VIEWPORT_HEIGHT){this.ui.handleClick(cx,cy,this);return;}

  _handleRightClick(cx,cy){
    if(this.gameState!=='playing'||cy>=VIEWPORT_HEIGHT)return;

    const sel=[...this.player.selectedIds].map(id=>this.entities.find(e=>e.id===id)).filter(e=>e&&e.alive&&e instanceof Unit&&e.team===TEAM.PLAYER);
    if(sel.length===0)return;
    const tgt=this._getEntityAtWorld(wx,wy);
    if(tgt&&tgt.team===TEAM.ENEMY){for(const u of sel)u.attackTarget(tgt);}
    else{const sr=Math.ceil(Math.sqrt(sel.length))*(TILE/2);sel.forEach((u,i)=>{const a=(i/sel.length)*Math.PI*2,r=(i===0)?0:sr*(0.5+Math.floor(i/6)*0.5);u.moveTo(clamp(wx+Math.cos(a)*r,TILE,MAP_COLS*TILE-TILE),clamp(wy+Math.sin(a)*r,TILE,MAP_ROWS*TILE-TILE),this);});}
  }
  _handleBoxSelect(cx1,cy1,cx2,cy2){
    if(this.gameState!=='playing'||Math.min(cy1,cy2)>=VIEWPORT_HEIGHT)return;
    const rect={x:Math.min(cx1+this.camera.x,cx2+this.camera.x),y:Math.min(cy1+this.camera.y,cy2+this.camera.y),w:Math.abs(cx2-cx1),h:Math.abs(cy2-cy1)};
    this.player.clearSelection();for(const e of this.entities){if(!e.alive||e.team!==TEAM.PLAYER||!(e instanceof Unit))continue;if(e.x>=rect.x&&e.x<=rect.x+rect.w&&e.y>=rect.y&&e.y<=rect.y+rect.h)this.player.addToSelection(e);}
  }
  _getEntityAtWorld(wx,wy){
    for(const e of[...this.entities].reverse()){if(!e.alive||!(e instanceof Building))continue;const bx=e.tileX*TILE,by=e.tileY*TILE,bw=e.tileW*TILE,bh=e.tileH*TILE;if(wx>=bx&&wx<=bx+bw&&wy>=by&&wy<=by+bh)return e;}
    for(const e of[...this.entities].reverse()){if(!e.alive||!(e instanceof Unit))continue;if(Math.sqrt((wx-e.x)**2+(wy-e.y)**2)<=e.radius+4)return e;}
    return null;
  }
  _checkWinLose(){
    const pd=this.entities.find(e=>e.alive&&e instanceof Building&&e.team===TEAM.PLAYER&&e.type===BLDG.DUGOUT);
    const ed=this.entities.find(e=>e.alive&&e instanceof Building&&e.team===TEAM.ENEMY&&e.type===BLDG.DUGOUT);
    if(!pd)this.gameState='lost';else if(!ed)this.gameState='won';
  }
  render(){this.renderer.render(this);}
}

// ─── main (boot) ─────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('gameCanvas');
  canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
  const game = new Game(canvas);
  game.gameState = 'start';
  let lastTime = null;
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    if (game.gameState === 'start') {
      const actions = game.input.getActions();
      for (const a of actions) { if (a.type === 'click_left' || a.type === 'mousedown_right') { game.init(); break; } }
    } else { game.update(dt); }
    game.render();
    requestAnimationFrame(loop);
  }
  game.render();
  requestAnimationFrame(loop);
});
</script>
